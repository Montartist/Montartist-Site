<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <title>Portfolio : Sybille C</title>
        <link rel="stylesheet" href="/files/styles/main.css">
        <link rel="shortcut icon" href="/files/assets/images/utils/fav.ico" type="image/x-icon">
    </head>
    <body>
        <header id="" class="header">
            <nav class="navbar">
                <div class="hlinks">
                    <input type="checkbox" id="sidebar-active">
                    <div id='hHome' class="">
                        <a class="hlink" class="" href="/">MONTARTIST</a>
                    </div>
                    <label id="overlay" for="sidebar-active"></label>
                    <label id="hBars" class="open-sidebar-button" for="sidebar-active"><img src="/files/assets/images/utils/bars.svg"></label>
                    <div class="links-container">
                        <label for="sidebar-active" class="close-sidebar-button">
                            <img src="/files/assets/images/utils/close.svg">
                        </label>
                        <a class="links-container-link" href="/">HOME</a>
                        <a class="links-container-link" href="/Portfolio/">PORTFOLIOS</a>
                        <a class="links-container-link" href="#">CONCOURS</a>
                    </div>
                </div>
            </nav>
        </header>
        <main>
            <div class="portfolio-list" id="portfolio-list"></div>
            <div class="portfolio-name-container">
                <h1 id="portfolio-name"></h1>
            </div>
            <section class="carrousel hPageCarrousel">
                <ul class="carInfo"></ul>
                <div class="carrousel-viewer">
                    <button class="carrouselL carrouselButton">
                        <img src="/files/assets/images/utils/left.svg" alt="Bouton gauche">
                    </button>
                    <div class="carrousel-img-container">
                        <img fetchpriority="high" class="carrouselImg" src="" alt="Image de carrousel"/>
                    </div>
                    <button class="carrouselR carrouselButton">
                        <img src="/files/assets/images/utils/right.svg" alt="Bouton Droit">
                    </button>
                </div>
                <div class="carrouselCollection"></div>
            </section>
            <section class="portfolioDesc">
                <h2 class="portfolioDescTitle"></h2>
                <div class="portfolioDescAutoportrait">
                    <img>
                </div>
                <p class="portfolioDescText"></p>
            </section>
        </main>

        <footer>
            <div id="footerText">
                <p class="contactUs">Nous contacter : <a href="mailto:contact@montartist.net">contact@montartist.net</a></p>
                <p class="collab">Ce site web a été réalisé en collaboration avec l'association <strong>Regarde !</strong></p>
            </div>
            <div class="logoRegarde"><img class="" src="/files/assets/images/utils/logoRegarde.svg" alt="Logo Regarde !"></div>
        </footer>
    </body>
    <script type="module" src="/files/scripts/main.js"></script>
</html>
